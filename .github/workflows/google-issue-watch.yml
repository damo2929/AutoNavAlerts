#
# Weekly check: has anything happened on the Google issues we wait on (tools/google-issues.txt,
# DESIGN.md §16 #21)? Opens (or comments on) one GitHub issue when a status changes or Google
# adds an update; otherwise does nothing. After reading it, run tools/check-google-issues.sh --update
# and commit the list so the same change isn't reported again.
#
# Cost: free, on the same terms as nav-sdk-feature-watch.yml: public repo, the free Linux runner
# only, no artifacts or caches, never two at once, capped at 10 minutes (it takes seconds).
name: Google issue watch

on:
  schedule:
    - cron: "0 7 * * 1"   # 07:00 UTC every Monday
  workflow_dispatch:      # run by hand from the Actions tab

permissions:
  contents: read
  issues: write

concurrency:
  group: google-issue-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest   # free standard runner; never use larger/macOS/Windows runners here
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the Google issues
        id: check
        run: |
          set +e
          tools/check-google-issues.sh | tee result.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 10 ]; then exit "$code"; fi
          exit 0

      - name: Open or update the tracking issue
        if: steps.check.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="A Google issue we wait on has changed"
          body="$(printf 'The weekly check found a change on a Google issue (DESIGN.md §16 #21, ISSUES.md L7/L8).\n\n```\n%s\n```\n\nNext steps:\n1. Read the issue on issuetracker.google.com.\n2. Act on it (e.g. L7: retest without LayoutProbeScreen on Android Auto 18.1; L8: try the new follow-zoom API).\n3. Run tools/check-google-issues.sh --update and commit tools/google-issues.txt.\n' "$(cat result.txt)")"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          else
            # The list isn't updated until someone reads the change: don't repeat the same comment weekly.
            last=$(gh issue view "$existing" --json comments,body --jq '(.comments | last | .body) // .body')
            if [ "$last" != "$body" ]; then gh issue comment "$existing" --body "$body"; fi
          fi
